<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>CK Editor Custom Element</title>
  <!-- Kontent Styling -->
  <link rel="stylesheet" href="custom-element.css" />
  <!-- Kentico Custom elements API-->
  <script src="https://app.kontent.ai/js-api/custom-element/v1/custom-element.min.js"></script>
  <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/47.1.0/ckeditor5.css" />
  <script src="https://cdn.ckeditor.com/ckeditor5/47.1.0/ckeditor5.umd.js"></script>
</head>

<body>
  <!-- Custom element HTML -->
  <div id="editor"></div>
  <script>
    AUTOSAVE_INTERVAL = 15000;
    let isElementDisabled = false;
    let editorInstance = null;

    /* Minimal plugin set aligned with typical CK commercial bundles (avoids license-key-plugin-not-allowed). */
    const {
      ClassicEditor,
      Plugin,
      ButtonView,
      IconImageUpload,
      Essentials,
      Paragraph,
      Heading,
      Bold,
      Italic,
      Underline,
      Link,
      List,
      Indent,
      Font,
      FontFamily,
      FontSize,
      FontColor,
      FontBackgroundColor,
      GeneralHtmlSupport,
      SourceEditing,
      Image,
      ImageToolbar,
      ImageCaption,
      ImageStyle
    } = CKEDITOR;

    /**
     * Opens Kontent asset library only — no OS file picker (ImageUpload plugin does that).
     * Reuses toolbar item name "imageUpload" so Kontent JSON configs stay valid.
     */
    class KontentAssetImagePlugin extends Plugin {
      static get pluginName() {
        return "KontentAssetImage";
      }

      init() {
        const editor = this.editor;
        const insertImageCommand = editor.commands.get("insertImage");

        editor.ui.componentFactory.add("imageUpload", locale => {
          const buttonView = new ButtonView(locale);

          buttonView.set({
            label: "Insert image",
            icon: IconImageUpload,
            tooltip: true
          });

          if (insertImageCommand) {
            buttonView.bind("isEnabled").to(insertImageCommand, "isEnabled");
          }

          buttonView.on("execute", () => {
            void insertImageFromKontentAsset(editor);
          });

          return buttonView;
        });
      }
    }

    const DEFAULT_TOOLBAR = [
      "undo", "redo", "|",
      "heading", "|",
      "bold", "italic", "underline", "|",
      "fontSize", "fontFamily", "fontColor", "fontBackgroundColor", "|",
      "bulletedList", "numberedList", "outdent", "indent", "|",
      "link", "|",
      "imageUpload", "|",
      "sourceEditing"
    ];

    const ALLOWED_TOOLBAR_ITEMS = new Set([
      "undo", "redo", "|",
      "heading",
      "bold", "italic", "underline",
      "fontSize", "fontFamily", "fontColor", "fontBackgroundColor",
      "bulletedList", "numberedList", "outdent", "indent",
      "link",
      "imageUpload",
      "sourceEditing"
    ]);

    /* Ensures toolbar always includes font controls even when Kontent config omits them. */
    const FONT_TOOLBAR_GROUP = ["fontSize", "fontFamily", "fontColor", "fontBackgroundColor"];

    const LEGACY_TOOLBAR_GROUP_MAP = {
      document: ["undo", "redo", "sourceEditing"],
      clipboard: ["undo", "redo"],
      editing: ["undo", "redo"],
      forms: [],
      basicstyles: ["bold", "italic", "underline"],
      paragraph: ["bulletedList", "numberedList", "outdent", "indent"],
      links: ["link"],
      insert: ["imageUpload"],
      styles: ["heading", "fontSize", "fontFamily", "fontColor", "fontBackgroundColor"],
      colors: ["fontColor", "fontBackgroundColor", "fontSize"],
      tools: ["sourceEditing"],
      others: [],
      about: []
    };

    CustomElement.init((element) => {
      const editorConfig = {
        /* Injected at deploy from Netlify env CKEDITOR_LICENSE_KEY (see scripts/netlify-build.sh). */
        licenseKey: "__CKEDITOR_LICENSE_KEY__",
        plugins: [
          Essentials,
          Paragraph,
          Heading,
          Bold,
          Italic,
          Underline,
          Link,
          List,
          Indent,
          Font,
          FontFamily,
          FontSize,
          FontColor,
          FontBackgroundColor,
          GeneralHtmlSupport,
          SourceEditing,
          Image,
          ImageToolbar,
          ImageCaption,
          ImageStyle,
          KontentAssetImagePlugin
        ],
        toolbar: normalizeToolbar(element && element.config && element.config.toolbar),
        htmlSupport: {
          allow: [
            {
              name: /.*/,
              attributes: true,
              classes: true,
              styles: true
            }
          ]
        },
        image: {
          toolbar: ["imageTextAlternative", "imageStyle:inline", "imageStyle:block", "imageStyle:side"]
        },
        fontSize: {
          options: ["tiny", "small", "default", "big", "huge"]
        },
        fontFamily: {
          options: [
            "default",
            "Arial, Helvetica, sans-serif",
            "Georgia, serif",
            "Tahoma, Geneva, sans-serif",
            "Times New Roman, Times, serif",
            "Verdana, Geneva, sans-serif"
          ]
        }
      };

      ClassicEditor.create(document.querySelector("#editor"), editorConfig)
        .then(editor => {
          editorInstance = editor;

          try {
            editor.disableReadOnlyMode("custom-element-disabled");
          } catch (e) {
            /* no active read-only lock */
          }

          CustomElement.onDisabledChanged(disabled => {
            const readonly = disabled === true || disabled === "true";
            isElementDisabled = readonly;
            if (readonly) {
              editor.enableReadOnlyMode("custom-element-disabled");
            } else {
              editor.disableReadOnlyMode("custom-element-disabled");
            }
          });

          editor.setData((element && element.value) || "");
          updateElementHeight();

          editor.model.document.on("change:data", () => {
            updateElementHeight();
          });

          editor.editing.view.document.on("blur", () => {
            save(editorInstance);
          });

          setInterval(() => {
            save(editorInstance);
          }, AUTOSAVE_INTERVAL);
        })
        .catch(error => {
          console.error("CKEditor 5 initialization failed:", error);
        });
    });

    async function insertImageFromKontentAsset(editor) {
      if (isElementDisabled) {
        return;
      }

      const selectedAssetUrl = await selectAndGetAsset();
      if (!selectedAssetUrl) {
        return;
      }

      try {
        editor.execute("insertImage", { source: selectedAssetUrl });
      } catch (error) {
        editor.model.change((writer) => {
          const imageElement = writer.createElement("imageBlock", {
            src: selectedAssetUrl
          });
          editor.model.insertContent(imageElement, editor.model.document.selection);
        });
      }
    }

    function selectAndGetAsset() {
      return new Promise((resolve) => {
        CustomElement.selectAssets({
          allowMultiple: false,
          fileType: "images"
        }).then(results => {
          if (!results || results.length === 0) {
            resolve(null);
            return;
          }

          CustomElement.getAssetDetails(results.map(e => e.id)).then(assets => {
            if (assets && assets[0] && assets[0].url) {
              resolve(assets[0].url);
            } else {
              resolve(null);
            }
          }).catch(() => resolve(null));
        }).catch(() => resolve(null));
      });
    }

    function normalizeToolbar(toolbarConfig) {
      if (!Array.isArray(toolbarConfig) || toolbarConfig.length === 0) {
        return DEFAULT_TOOLBAR;
      }

      if (typeof toolbarConfig[0] === "string") {
        return filterToolbarItems(toolbarConfig);
      }

      const normalized = [];
      toolbarConfig.forEach(group => {
        if (group === "/") {
          normalized.push("|");
          return;
        }

        const groupName = group && group.name;
        const items = LEGACY_TOOLBAR_GROUP_MAP[groupName] || [];
        items.forEach(item => {
          if (!normalized.includes(item)) {
            normalized.push(item);
          }
        });
      });

      return filterToolbarItems(normalized.length ? normalized : DEFAULT_TOOLBAR);
    }

    function filterToolbarItems(items) {
      const out = [];
      items.forEach(item => {
        if (ALLOWED_TOOLBAR_ITEMS.has(item)) {
          out.push(item);
        }
      });
      const base = out.length ? out : DEFAULT_TOOLBAR;
      return collapseToolbarSeparators(ensureFontToolbarGroup(base));
    }

    function ensureFontToolbarGroup(items) {
      if (FONT_TOOLBAR_GROUP.every(name => items.includes(name))) {
        return items;
      }

      const rest = items.filter(name => !FONT_TOOLBAR_GROUP.includes(name));
      const afterUnderline = rest.lastIndexOf("underline");
      const afterHeading = rest.lastIndexOf("heading");
      const insertAt =
        afterUnderline >= 0 ? afterUnderline + 1 : afterHeading >= 0 ? afterHeading + 1 : 0;

      const head = rest.slice(0, insertAt);
      const tail = rest.slice(insertAt);

      const merged = [];
      merged.push(...head);
      if (head.length && FONT_TOOLBAR_GROUP.length) {
        merged.push("|");
      }
      merged.push(...FONT_TOOLBAR_GROUP);
      if (tail.length) {
        merged.push("|");
      }
      merged.push(...tail);
      return merged;
    }

    function collapseToolbarSeparators(items) {
      const out = [];
      items.forEach(item => {
        if (item === "|" && out[out.length - 1] === "|") {
          return;
        }
        out.push(item);
      });
      while (out[0] === "|") {
        out.shift();
      }
      while (out[out.length - 1] === "|") {
        out.pop();
      }
      return out;
    }

    /* Saves custom element value */
    function save(editor) {
      if (!editor || isElementDisabled) return;
      let data = editor.getData();
      if (data.replace(/<[^>]*(>|$)|&nbsp;|&zwnj;|&raquo;|&laquo;|&gt;|\s/g, "") == "") data = null;
      CustomElement.setValue(data);
    }

    /* Resizes custom element iframe based on document height. Won't pass MAX_HEIGHT. */
    function updateElementHeight() {
      const height = Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      CustomElement.setHeight(height);
    }
  </script>
</body>

</html>
