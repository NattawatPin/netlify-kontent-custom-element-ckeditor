<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>CK Editor Custom Element</title>
  <!-- Kontent Styling -->
  <link rel="stylesheet" href="custom-element.css" />
  <!-- Kentico Custom elements API-->
  <script src="https://app.kontent.ai/js-api/custom-element/v1/custom-element.min.js"></script>
  <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/47.1.0/ckeditor5.css" />
  <script src="https://cdn.ckeditor.com/ckeditor5/47.1.0/ckeditor5.umd.js"></script>
</head>

<body>
  <!-- Custom element HTML -->
  <div id="editor" contenteditable="true"></div>
  <script>
    AUTOSAVE_INTERVAL = 15000;
    let isElementDisabled = false;
    let editorInstance = null;

    const {
      ClassicEditor,
      Essentials,
      Paragraph,
      Heading,
      Bold,
      Italic,
      Underline,
      Strikethrough,
      RemoveFormat,
      Link,
      List,
      BlockQuote,
      Indent,
      AutoLink,
      HorizontalLine,
      Code,
      CodeBlock,
      Table,
      TableToolbar,
      Alignment,
      Font,
      SourceEditing,
      Image,
      ImageToolbar,
      ImageCaption,
      ImageStyle,
      ImageResize,
      ImageUpload
    } = CKEDITOR;

    const DEFAULT_TOOLBAR = [
      "undo", "redo", "|", "heading", "|", "bold", "italic", "underline",
      "strikethrough", "removeFormat", "|", "link", "bulletedList",
      "numberedList", "outdent", "indent", "|", "alignment", "blockQuote",
      "insertTable", "imageUpload", "horizontalLine", "|", "code", "codeBlock", "sourceEditing"
    ];

    const LEGACY_TOOLBAR_GROUP_MAP = {
      document: ["undo", "redo", "sourceEditing"],
      clipboard: ["undo", "redo"],
      editing: ["undo", "redo"],
      forms: [],
      basicstyles: ["bold", "italic", "underline", "strikethrough", "removeFormat"],
      paragraph: ["bulletedList", "numberedList", "outdent", "indent", "alignment", "blockQuote"],
      links: ["link"],
      insert: ["insertTable", "imageUpload", "horizontalLine"],
      styles: ["heading"],
      colors: ["fontColor", "fontBackgroundColor"],
      tools: ["sourceEditing"],
      others: [],
      about: []
    };

    CustomElement.init((element) => {
      const editorConfig = {
        licenseKey: "GPL",
        plugins: [
          Essentials,
          Paragraph,
          Heading,
          Bold,
          Italic,
          Underline,
          Strikethrough,
          RemoveFormat,
          Link,
          List,
          BlockQuote,
          Indent,
          AutoLink,
          HorizontalLine,
          Code,
          CodeBlock,
          Table,
          TableToolbar,
          Alignment,
          Font,
          SourceEditing,
          Image,
          ImageToolbar,
          ImageCaption,
          ImageStyle,
          ImageResize,
          ImageUpload
        ],
        toolbar: normalizeToolbar(element && element.config && element.config.toolbar),
        image: {
          toolbar: ["imageTextAlternative", "imageStyle:inline", "imageStyle:block", "imageStyle:side"]
        },
        table: {
          contentToolbar: ["tableColumn", "tableRow", "mergeTableCells"]
        }
      };

      ClassicEditor.create(document.querySelector("#editor"), editorConfig)
        .then(editor => {
          editorInstance = editor;

          CustomElement.onDisabledChanged(readonly => {
            isElementDisabled = readonly;
            if (readonly) {
              editor.enableReadOnlyMode("custom-element-disabled");
            } else {
              editor.disableReadOnlyMode("custom-element-disabled");
            }
          });

          editor.setData((element && element.value) || "");
          updateElementHeight();

          editor.model.document.on("change:data", () => {
            updateElementHeight();
          });

          setupKontentAssetPicker(editor);

          editor.editing.view.document.on("blur", () => {
            save(editorInstance);
          });

          setInterval(() => {
            save(editorInstance);
          }, AUTOSAVE_INTERVAL);
        })
        .catch(error => {
          console.error("CKEditor 5 initialization failed:", error);
        });
    });

    function setupKontentAssetPicker(editor) {
      const imageUploadCommand = editor.commands.get("imageUpload");
      if (!imageUploadCommand) {
        return;
      }

      imageUploadCommand.on("execute", async (eventInfo) => {
        eventInfo.stop();

        if (isElementDisabled) {
          return;
        }

        const selectedAssetUrl = await selectAndGetAsset();
        if (!selectedAssetUrl) {
          return;
        }

        try {
          editor.execute("insertImage", { source: selectedAssetUrl });
        } catch (error) {
          editor.model.change((writer) => {
            const imageElement = writer.createElement("imageBlock", {
              src: selectedAssetUrl
            });
            editor.model.insertContent(imageElement, editor.model.document.selection);
          });
        }
      }, { priority: "high" });
    }

    /* Displays asset selector and returns URL of the selected asset */
    function selectAndGetAsset() {
      return new Promise((resolve) => {
        CustomElement.selectAssets({
          allowMultiple: false,
          fileType: "images"
        }).then(results => {
          if (!results || results.length === 0) {
            resolve(null);
            return;
          }

          CustomElement.getAssetDetails(results.map(e => e.id)).then(assets => {
            if (assets && assets[0] && assets[0].url) {
              resolve(assets[0].url);
            } else {
              resolve(null);
            }
          }).catch(() => resolve(null));
        }).catch(() => resolve(null));
      });
    }

    function normalizeToolbar(toolbarConfig) {
      if (!Array.isArray(toolbarConfig) || toolbarConfig.length === 0) {
        return DEFAULT_TOOLBAR;
      }

      if (typeof toolbarConfig[0] === "string") {
        return toolbarConfig;
      }

      const normalized = [];
      toolbarConfig.forEach(group => {
        if (group === "/") {
          normalized.push("|");
          return;
        }

        const groupName = group && group.name;
        const items = LEGACY_TOOLBAR_GROUP_MAP[groupName] || [];
        items.forEach(item => {
          if (!normalized.includes(item)) {
            normalized.push(item);
          }
        });
      });

      return normalized.length ? normalized : DEFAULT_TOOLBAR;
    }

    /* Saves custom element value */
    function save(editor) {
      if (!editor || isElementDisabled) return;
      let data = editor.getData();
      if (data.replace(/<[^>]*(>|$)|&nbsp;|&zwnj;|&raquo;|&laquo;|&gt;|\s/g, "") == "") data = null;
      CustomElement.setValue(data);
    }

    /* Resizes custom element iframe based on document height. Won't pass MAX_HEIGHT. */
    function updateElementHeight() {
      const height = Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      CustomElement.setHeight(height);
    }
  </script>
</body>

</html>
